<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Convites | Painel I &amp; M</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700&family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>

<body class="admin-body">

  <!-- Login -->
  <div id="login-screen" class="admin-login">
    <div class="admin-login-card">
      <div class="hero-ornament top">✦</div>
      <h1 class="admin-login-title">I &amp; M</h1>
      <p class="admin-login-question">Qual o nome da cama?</p>
      <form id="login-form">
        <input type="password" id="login-secret" class="form-input" placeholder="Resposta" autocomplete="off" required>
        <button type="submit" class="rsvp-gold-btn admin-full-btn">Entrar</button>
        <p id="login-error" class="admin-error hidden">Resposta incorreta</p>
      </form>
    </div>
  </div>

  <!-- Painel -->
  <div id="panel" class="admin-panel hidden">
    <header class="admin-header">
      <h1>Convites</h1>
      <div id="admin-summary" class="admin-summary"></div>
    </header>

    <div id="guest-list" class="guest-list"></div>

    <button id="fab-add" class="fab-add" aria-label="Novo convite">+</button>
  </div>

  <!-- Modal criar/editar -->
  <div id="guest-modal" class="admin-modal hidden">
    <div class="admin-modal-card">
      <h2 id="modal-title">Novo convite</h2>
      <form id="guest-form">
        <input type="hidden" id="guest-token">
        <div class="form-group">
          <label class="form-label">Nome</label>
          <input type="text" id="guest-name" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Mensagem personalizada</label>
          <textarea id="guest-message" class="form-input form-textarea" rows="4"></textarea>
        </div>
        <div class="admin-modal-actions">
          <button type="button" id="modal-cancel" class="admin-btn-secondary">Cancelar</button>
          <button type="submit" class="rsvp-gold-btn">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden">
    <span id="toast-message"></span>
  </div>

  <script src="/js/admin.js"></script>
</body>

</html>
